name: Build iOS Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install ldid dpkg
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV

    - name: Build package
      run: |
        export THEOS=$HOME/theos
        make package

    - name: Extract dylib
      run: |
        mkdir -p output
        cp .theos/obj/debug/kora_bypass.dylib output/kora_bypass.dylib || true
        cp .theos/obj/kora_bypass.dylib output/kora_bypass.dylib || true
        ls -la output/

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: kora_bypass_dylib
        path: output/kora_bypass.dylib
